<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- index.php just for html turn into php, and multipart/form data for image to send mixed data types—such as text fields and binary files—together in a single request -->
    <form action="index.php" method="POST" enctype="multipart/form-data">
        <label for="username">username:</label>
        <input type="text" id="username" placeholder="spongebob" minlenght="6" maxlength="15" required>

<!-- for password, you need required to be inputted, and min/max length and also watch out of typo of minleng(ht)-->

        <label for="password">password:</label>
        <input type="password" id="password" placeholder="enter pussi" minlength="3" maxlength="15" required><br>

<!-- for this just input type email and placeholder should be gmail.com-->

        <label for="email">email</label>
        <input type="email" id="email" placeholder="guest123@gmail.com" ><br>

<!--for phone the type are tel and the place holder should be 123-457 and so on. and pattern are like for [0-9] are like country number. meanwhile {3} is the normal phone number. -->

        <label for="phone">phone #:</label>
        <input type="tel" id="phone" placeholder="123-456-7890" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"><br>
        
<!-- quantity are quantity. example, if you want to buy an item you can input how many-->

        <label for="bday">birthdate</label>
        <input type="date" id="body"><br>

        <label for="quantity">quantity</label>
        <input type="number" id="quantity" min="0" max="90" value="1"><br>

<!-- So this part where uh, you want to be called based on gender or degree. and whats value do is to calling out in what inside label-->

        <label for="title">title</label>

        <label for="Mr.">Mr.</label>
        <input type="radio" id="Mr." value="Mr." name="title">
        <label for="Ms.">Ms.</label>
        <input type="radio" id="Ms." value="Ms." name="title">
        <label for="PhD.">PhD.</label>
        <input type="radio" id="PhD" value="PhD." name="title"><br>

<!-- payment is payment. Value are the grade to be callout-->

        <label for="payment">payment</label>
        <select id="payment">
            <option value="visa">visa</option>
            <option value="">mastercard</option>
            <option value="giftcard">giftcard</option>
        </select><br>

<!-- for subscribe, its bascially a checkbox. as story, if the users are wanted to know the update they can click the checkbox-->

        <label for="subscribe">subscribe</label>
        <input type="checkbox" id="subscribe"><br>

<!-- for comment, as its name. User can commment. for row it effects top and below. meanwhile cols effect left and right-->

        <label for="comment">comment:</label>
        <textarea id="comment" rows="3" cols="25"></textarea>

<!--for file, user can posted an image. As a story an users need to upload an image to be put up as evidence. in the accept its a format to must be input. example, png, jpeg. not only image but any type of format such as PDF and any progamming languages IF NECCESARY-->

        <label for="file">file</label>
        <input type="file" id="file" accept="image/png, image/jpeg"><br>

<!-- and the input type of reset or submit button. If reset then all gone but if submit the data be sent to the server-->
        <input type="reset"><br>
        <input type="submit">

    </form>

</body>
</html>
